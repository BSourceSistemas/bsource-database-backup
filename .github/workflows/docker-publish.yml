name: Publicar imagem assinada

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require matching version tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PYTHON'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_REF"] != f"refs/tags/v{version}":
              raise SystemExit("Publish from the version tag matching pyproject.toml")
          PYTHON
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m pytest
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: bsourcedev/bsource-database-backup
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
      - name: Build image for security gate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: bsource-database-backup:release-candidate
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bsource-database-backup:release-candidate
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Build and push immutable image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: bsourcedev/bsource-database-backup@${{ steps.push.outputs.digest }}
          format: spdx-json
          artifact-name: bsource-database-backup.spdx.json
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Sign digest using GitHub OIDC
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "bsourcedev/bsource-database-backup@${DIGEST}"
      - name: Record immutable release reference
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "### Published image"
            echo "Version: ${VERSION}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Image: bsourcedev/bsource-database-backup:${VERSION}"
            echo "Digest: bsourcedev/bsource-database-backup@${DIGEST}"
            echo "VPS relay and real R2 restore acceptance: pending operator validation."
          } >> "$GITHUB_STEP_SUMMARY"
