name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m ruff format --check app tests scripts
      - run: python -m ruff check app tests scripts
      - run: python -m mypy app
      - run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=75

  image:
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: bsource-database-backup:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: >-
          docker run --rm
          -e DB_TYPE=postgres -e DB_HOST=localhost -e DB_PORT=5432
          -e DB_USER=backup -e DB_PASSWORD=test-secret -e DB_DATABASE=test
          -e STORAGE_TYPE=local -e STORAGE_LOCAL_PATH=/tmp/backups
          -e BACKUP_TIMEZONE=UTC
          bsource-database-backup:test config check

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  postgres-restore:
    needs: python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-image:
          - postgres:15.18-bookworm
          - postgres:16.14-bookworm
          - postgres:17.10-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: bsource-database-backup:test
          cache-from: type=gha
      - run: bash tests/integration/postgres_restore.sh "${{ matrix.postgres-image }}"

  engine-restore:
    needs: python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: mysql
            image: mysql:8.0.46
          - engine: mysql
            image: mysql:8.4.9
          - engine: mariadb
            image: mariadb:10.11.14
          - engine: mariadb
            image: mariadb:11.4.9
          - engine: mongodb
            image: mongo:7.0
          - engine: mongodb
            image: mongo:8.2
          - engine: mssql
            image: mcr.microsoft.com/mssql/server:2019-CU32-ubuntu-20.04
          - engine: mssql
            image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: bsource-database-backup:test
          cache-from: type=gha
      - run: python tests/integration/engine_restore.py "${{ matrix.engine }}" "${{ matrix.image }}"
