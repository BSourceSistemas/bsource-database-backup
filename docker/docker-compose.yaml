services:
  bsource-db-backup:
    container_name: bsource-db-backup
    build:
      context: ..
      dockerfile: docker/Dockerfile
      platforms:
        - linux/amd64
    env_file:
      - path: .env
        required: false
    volumes:
      - backup-state:/var/lib/bsource-backup
    restart: unless-stopped
    # Produção: prefira sha-* ou digest imutável.
    # image: bsourcedev/bsource-database-backup:sha-xxxxxxx
    ports:
      - "127.0.0.1:8080:8080"
    
    # Configurações de recursos (opcional)
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
          
volumes:
  backup-state:
